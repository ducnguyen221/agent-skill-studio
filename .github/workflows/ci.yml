name: Agent Skill Studio quality gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
        include:
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check portability manifests and external eval metadata
        run: python studio.py validate --all --require-evals
      - name: Validate eval manifests (not model execution)
        run: |
          status=0
          python studio.py evals --all 2> "$RUNNER_TEMP/evals.err" || status=$?
          cat "$RUNNER_TEMP/evals.err" >&2
          if grep -q "model_evaluated gate skipped" "$RUNNER_TEMP/evals.err"; then
            echo "::error::the model_evaluated gate was skipped on the Studio repository; it must run here"
            exit 1
          fi
          exit "$status"
      - name: Unit and local link tests
        env:
          STUDIO_REQUIRE_SYMLINK: '1'  # a runner that cannot make a symlink fails the symlink cases instead of skipping them
        run: python -m unittest discover -s tests -v
      - name: Package the shipped skill (exclude evals)
        run: python studio.py package skills/skill-creator-studio --out "${{ runner.temp }}/ass-ci"
      - name: skill-curator runs alone from its ZIP and from install (no skill-creator-studio beside it)
        run: |
          fixture="$PWD/tests/fixtures/opcos-tree/plugins/p-default/skills"
          python studio.py package skills/skill-curator --out "$RUNNER_TEMP/solo-zip"
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/solo-zip/skill-curator.zip" "$RUNNER_TEMP/solo"
          mkdir -p "$RUNNER_TEMP/solo-ws"
          python studio.py install skills/skill-curator --agent claude --workspace "$RUNNER_TEMP/solo-ws"
          cd "$RUNNER_TEMP"
          for tool in "$RUNNER_TEMP/solo/skill-curator/scripts/curator.py" "$RUNNER_TEMP/solo-ws/.claude/skills/skill-curator/scripts/curator.py"; do
            python "$tool" catalog --help
            python "$tool" doctor --roots "$fixture"
          done
      - name: Validate the CSV sample skill (examples/, not shipped)
        run: python studio.py validate examples/data-quality-audit --require-evals
      - name: Explicit model-evaluation disclaimer
        run: echo 'Static CI does NOT execute model-dependent evaluations; use evals/RUNBOOK.md.'

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Lint workflows (actionlint 1.7.7, pinned by digest)
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color
